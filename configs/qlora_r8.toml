# A3: same as A1, but LoRA rank 8 (alpha keeps the same 2:1 ratio).
name = "qlora-r8"

[model]
id = "Qwen/Qwen2.5-Coder-1.5B-Instruct"
revision = "2e1fd397ee46e1388853d2af2c993145b0f1098a"

[quantization]
load_in_4bit = true
quant_type = "nf4"
double_quant = true
compute_dtype = "float16"

[lora]
r = 8
alpha = 16
dropout = 0.05
target_modules = ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

[prompt]
version = "v1"
schema_style = "ddl"
include_foreign_keys = true

[train]
epochs = 2
learning_rate = 2e-4
lr_scheduler = "cosine"
warmup_ratio = 0.03
weight_decay = 0.0
# Batch 4 used 10.3 GB of a 15 GB T4 at 547 tokens, so batch 2 x 8 keeps 16 per step.
batch_size = 2
grad_accum = 8
max_seq_len = 1536
seed = 42
logging_steps = 10
save_steps = 100
# Checkpoint rule, fixed before training: use the final checkpoint. Dev is not used to pick one.
