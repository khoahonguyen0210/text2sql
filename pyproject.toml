[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "text2sql"
version = "1.0.0"
description = "Fine-tune a small language model to write SQL from questions, with QLoRA, on Spider 1.0."
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "sqlglot>=30,<31",
    "sqlparse>=0.5,<1",
    "nltk>=3.9,<4",
    "pydantic>=2.9,<3",
]

[project.optional-dependencies]
model = [
    "torch>=2.9",
    "transformers>=5.0,<6",
    "peft>=0.18,<1",
    "accelerate>=1.3,<2",
]
train = [
    "bitsandbytes>=0.48; sys_platform == 'linux'",
]
serve = [
    "fastapi>=0.120,<1",
    "uvicorn>=0.32,<1",
]
dev = [
    "pytest>=8.3,<10",
    "httpx>=0.27,<1",
    "ruff>=0.8,<1",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"text2sql.serving" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "data: needs the downloaded Spider data",
    "model: needs model weights",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["external"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
