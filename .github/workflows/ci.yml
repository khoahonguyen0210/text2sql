name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --locked --extra model --extra serve --extra dev
      - name: Fetch the pinned evaluator
        run: uv run python scripts/fetch_evaluator.py
      - name: Lint
        run: uv run ruff check src tests scripts kaggle
      - name: Test
        run: uv run pytest -q
